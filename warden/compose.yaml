# Build context is the parent (infra/) so the image carries all three sentinels.
name: proj344
services:
  evidence-integrity:                    # sentinel: WARDEN (bundles PLUMB + TETHER + DOWSER)
    build:
      context: ..
      dockerfile: warden/Dockerfile
    container_name: proj344-warden
    environment:
      PORT: "8090"
      DROPLET_HOST: "137.184.1.91"
      # Flip the WHOLE stack OFFLINE->LIVE with one line (points every engine at the .91 lake):
      # CORPUS_DSN: "postgres://reader:${READ_PW}@pg-duckdb-lake:5432/doc_lake"
      # DATABASE_URL: "postgres://reader:${READ_PW}@pg-duckdb-lake:5432/doc_lake"
      # TWIN_GLOB: "/data/twins/**/*.items.parquet"
      # COMM_GLOB: "/data/comms/*.json"
    ports:
      - "8090:8090"       # combined board
    volumes:
      - ${DATA_DIR:-./sample_data}:/data:ro
    restart: unless-stopped
